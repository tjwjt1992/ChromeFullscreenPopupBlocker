name: Windows x64 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build x64
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Package portable release
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: portable-x64
          path: dist/*
          if-no-files-found: error
