name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Validate version tag
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$') {
            throw 'VERSION must contain a semantic version.'
          }
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Tag $env:RELEASE_TAG must match VERSION (v$version)."
          }
      - name: Build x64
        run: ./scripts/build.ps1
      - name: Package portable release
        run: ./scripts/package.ps1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $releaseArgs = @(
            'release', 'create', $env:RELEASE_TAG,
            "dist/FullscreenPopupBlocker-$version-x64.zip", 'dist/SHA256SUMS.txt',
            '--verify-tag', '--generate-notes',
            '--title', "Fullscreen Popup Blocker $env:RELEASE_TAG"
          )
          if ($version.Contains('-')) { $releaseArgs += '--prerelease' }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
